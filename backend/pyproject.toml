[project]
name = "abq-platform-backend"
version = "0.1.0"
description = "ABQ Lab — LLM orchestration backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sse-starlette>=2.1.0",
  "pydantic-settings>=2.6.0",
  "pyyaml>=6.0.2",
  "aiofiles>=24.1.0",
  "httpx>=0.28.0",
  "openai>=1.57.0",
  "langgraph>=0.2.0",
  "langchain-core>=0.3.0",
  "langchain-openai>=0.2.0",
  "numpy>=2.0.0",
  "pandas>=2.2.0",
  "gplearn>=0.4.2",
  "scikit-learn>=1.3.0",
  "akshare>=1.14",
  "baostock>=0.8.9",
  "pypdf>=5.0.0",
]

[project.scripts]
abq-api = "app.main:run"
abq-memory = "app.cli:memory_main"
abq-graph = "app.cli:graph_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = [
  "E501",   # line length handled by formatter
  "B008",   # FastAPI Depends() in defaults is idiomatic
  "UP007",  # PEP 604 unions in 3.12 are fine; keep Optional for clarity in places
]

[tool.ruff.lint.per-file-ignores]
"app/tools/langchain_tools.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
warn_redundant_casts = false
exclude = ["tests/", "app/factors/mine_gp\\.py", "app/factors/mine_gp_cs\\.py"]

